# O
# Comment at the start of the file
client_max_body_size 1000000; # Simple directive with parameter and sticky comment

server { # Block directive start
    listen 80;
    root /var/www/html;
    index index.html index.htm; # Simple directive with multiple parameters

    error_page 404 /404.html;

    location / { # Block directive with argument
        allow_methods GET POST;
        autoindex on;
    }

    location /old-url {
        return 301 /new-url; # Redirection case
    }

    location /cgi-bin {
        root /var/www;
        cgi_extension .php .py; # CGI configuration [5]
    }

    location /upload {
        allow_methods POST DELETE;
        upload_store /tmp/uploads; # Upload storage [4]
    }
}

# Sticky symbol testing for Lexer (no whitespace between words and symbols)
server{listen 8080;location /test{root /tmp;}} # Valid NGINX-style syntax [1, 6]
